<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Remote Controller</title>
    <link rel="stylesheet" href="controller.css">
</head>
<body>
    <div id="controller-container">
        <!-- Title -->
        <div id="title">REMOTE CONTROLLER</div>
        
        <!-- Trackpad Area -->
        <div id="trackpad-area">
            <div id="trackpad">
                <div id="trackpad-indicator"></div>
            </div>
            <div id="trackpad-hint">Sleep om te bewegen</div>
        </div>
        
        <!-- Shoot Button -->
        <button id="shoot-btn">SHOOT</button>
        
        <!-- Reset Button -->
        <button id="reset-btn">RESET</button>
        
        <!-- Connection Status -->
        <div id="connection-status">Verbinden...</div>
        
        <!-- Manual Connection (fallback) -->
        <div id="manual-connection" style="display: none;">
            <p>Kan geen verbinding maken? Voer het IP adres van de computer in:</p>
            <input type="text" id="server-ip" placeholder="bijv. 192.168.1.100" />
            <button id="connect-btn">Verbind</button>
        </div>
    </div>
    
    <script src="controller.js"></script>
</body>
</html>

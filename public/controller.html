<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Remote Controller</title>
    <link rel="stylesheet" href="controller.css">
</head>
<body>
    <div id="controller-wrapper">
        <header id="controller-hud">
            <span id="connection-status" class="status-pill">Controller verbinden...</span>
        </header>

        <div id="main-area">
            <div id="trackpad-shell">
                <div id="trackpad">
                    <div id="trackpad-center">+</div>
                    <div id="trackpad-indicator"></div>
                </div>
                <p id="trackpad-subtext">GAME ACTIEF — BEWEEG DE TRACKPAD</p>
            </div>

            <button id="shoot-btn">SHOOT</button>
        </div>
    </div>

    <div id="manual-connection" style="display:none;">
        <p>Kan geen verbinding maken? Voer het IP adres van de computer in:</p>
        <input type="text" id="server-ip" placeholder="bijv. 192.168.1.100" />
        <button id="connect-btn">Verbind</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Elementen ophalen ---
            const trackpad = document.getElementById('trackpad');
            const trackpadIndicator = document.getElementById('trackpad-indicator');
            const shootBtn = document.getElementById('shoot-btn');
            const connectionStatus = document.getElementById('connection-status');
            const helpBtn = document.getElementById('help-btn');

            // --- State ---
            let ws = null;
            let trackpadActive = false;
            let shootInterval = null;

            // --- WebSocket ---
            function connectWebSocket(customHost = null) {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const host = customHost || window.location.host;
                updateStatus('Verbinden...');
                ws = new WebSocket(`${protocol}//${host}`);
                ws.onopen = () => {
                    updateStatus('Controller verbonden');
                    shootBtn.disabled = false;
                    trackpad.style.opacity = '1';
                    ws.send(JSON.stringify({ type: 'register', role: 'controller' }));
                };
            ws.onmessage = (e) => {
                try {
                    const d = JSON.parse(e.data);
                    if (d.type === 'registered') {
                        const idLabel = d.playerId ? `Speler ${d.playerId}` : 'Controller';
                        updateStatus(`${idLabel} verbonden`);
                    }
                    if (d.type === 'game_connected') updateStatus('Game verbonden');
                    if (d.type === 'player_update') {
                        const count = d.count || 0;
                        const max = d.maxPlayers || 2;
                        const your = d.yourPlayerId ? ` (jij: speler ${d.yourPlayerId})` : '';
                        updateStatus(`${count}/${max} spelers actief${your}`);
                    }
                    if (d.type === 'controller_full') {
                        updateStatus('Lobby vol (2 spelers)');
                        shootBtn.disabled = true;
                        trackpad.style.opacity = '0.55';
                    }
                    if (d.type === 'status') updateStatus(d.message);
                } catch (err) {}
            };
                ws.onclose = () => {
                    updateStatus('Verbroken');
                    setTimeout(() => connectWebSocket(), 3000);
                };
                ws.onerror = () => {
                    updateStatus('Verbindingsfout');
                    showManualConnection();
                };
            }

            function sendWS(obj) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify(obj));
                }
            }

            function sendAim(x, y) {
                sendWS({ type: 'aim', x: clamp01(x), y: clamp01(y) });
            }

            function updateStatus(msg) {
                if (connectionStatus) connectionStatus.textContent = msg;
            }

            // --- Trackpad ---
            function getPos(e) {
                const rect = trackpad.getBoundingClientRect();
                const src = e.touches ? e.touches[0] : e;
                return { x: src.clientX - rect.left, y: src.clientY - rect.top, w: rect.width, h: rect.height };
            }

            function handleTrackpadInput(e) {
                e.preventDefault();
                const p = getPos(e);
                trackpadActive = true;
                trackpad.classList.add('active');
                const ix = Math.max(30, Math.min(p.x, p.w - 30));
                const iy = Math.max(30, Math.min(p.y, p.h - 30));
                trackpadIndicator.style.left = ix + 'px';
                trackpadIndicator.style.top = iy + 'px';
                sendAim(p.x / p.w, p.y / p.h);
            }

            function handleTrackpadEnd() {
                trackpadActive = false;
                trackpad.classList.remove('active');
            }

            trackpad.addEventListener('touchstart', handleTrackpadInput, { passive: false });
            trackpad.addEventListener('touchmove', handleTrackpadInput, { passive: false });
            trackpad.addEventListener('touchend', handleTrackpadEnd);
            trackpad.addEventListener('touchcancel', handleTrackpadEnd);
            trackpad.addEventListener('mousedown', handleTrackpadInput);
            document.addEventListener('mousemove', (e) => {
                if (trackpadActive) handleTrackpadInput(e);
            });
            document.addEventListener('mouseup', handleTrackpadEnd);

            // --- Shoot ---
            function startShooting(e) {
                e.preventDefault();
                shootBtn.classList.add('firing');
                sendWS({ type: 'shoot' });
                shootInterval = setInterval(() => sendWS({ type: 'shoot' }), 100);
            }

            function stopShooting(e) {
                e.preventDefault();
                shootBtn.classList.remove('firing');
                clearInterval(shootInterval);
                shootInterval = null;
            }

            shootBtn.addEventListener('touchstart', startShooting, { passive: false });
            shootBtn.addEventListener('touchend', stopShooting, { passive: false });
            shootBtn.addEventListener('touchcancel', stopShooting);
            shootBtn.addEventListener('mousedown', startShooting);
            shootBtn.addEventListener('mouseup', stopShooting);
            shootBtn.addEventListener('mouseleave', stopShooting);

            // --- Help ---
            if (helpBtn) {
                helpBtn.addEventListener('click', () => {
                    alert('Joystick: beweeg je vinger over het trackpad.\nShoot: klik en houd vast om te schieten.');
                });
            }

            // --- Manual connection ---
            function showManualConnection() {
                const el = document.getElementById('manual-connection');
                if (el) el.style.display = 'block';
            }

            const connectBtn = document.getElementById('connect-btn');
            const serverIp = document.getElementById('server-ip');
            if (connectBtn && serverIp) {
                connectBtn.addEventListener('click', () => {
                    const ip = serverIp.value.trim();
                    if (!ip) return;
                    if (ws) ws.close();
                    connectWebSocket(`${ip}:3000`);
                });
                serverIp.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') connectBtn.click();
                });
            }

            // --- Utils ---
            function clamp01(v) {
                return Math.max(0, Math.min(1, v));
            }

            // --- Start ---
            connectWebSocket();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Remote Controller</title>
    <link rel="stylesheet" href="controller.css">
</head>
<body>
    <div id="controller-wrapper">
        <!-- Main Content Area -->
        <div id="main-area">
            <!-- Trackpad (Left Side) -->
            <div id="trackpad">
                <div id="trackpad-center">+</div>
                <div id="trackpad-indicator"></div>
            </div>
            
            <!-- Shoot Button (Right Side) -->
            <button id="shoot-btn">SHOOT</button>
        </div>
        
        <!-- Help Button (Right Bottom Corner) -->
        <button id="help-btn">?</button>
        
        <!-- Status Bar (Bottom) -->
        <div id="status-bar">
            <span id="connection-status">GAME ACTIEF - BEWEEG DE TRACKPAD EN KLIK OP SHOOT</span>
        </div>
    </div>
    
    <!-- Manual Connection (hidden fallback) -->
    <div id="manual-connection" style="display: none;">
        <p>Kan geen verbinding maken? Voer het IP adres van de computer in:</p>
        <input type="text" id="server-ip" placeholder="bijv. 192.168.1.100" />
        <button id="connect-btn">Verbind</button>
    </div>
    
    <script src="controller.js"></script>
</body>
</html>

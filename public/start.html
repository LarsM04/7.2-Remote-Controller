<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Controller - Start</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0d1b2a;
            --panel-dark: #101a2b;
            --accent-cyan: #00e5ff;
            --accent-yellow: #f1c40f;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --label-gray: #91a4ba;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 0%, #16334f 0%, var(--bg-dark) 56%, #08111c 100%);
            color: #eef4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .start-container {
            width: min(100%, 680px);
            padding: 30px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(180deg, rgba(13, 27, 42, 0.94), rgba(8, 16, 26, 0.98));
            box-shadow: inset 0 0 46px rgba(0, 0, 0, 0.46), 0 14px 36px rgba(0, 0, 0, 0.35);
        }

        .logo {
            font: 800 clamp(2rem, 6vw, 3.4rem)/0.95 'Orbitron', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .logo .logo-main {
            display: block;
            color: #ffffff;
        }

        .logo .logo-sub {
            display: block;
            color: var(--accent-cyan);
        }

        .connection-status {
            margin: 14px 0 22px;
            padding: 10px 14px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font: 700 14px/1 'Orbitron', monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-waiting {
            background: rgba(241, 196, 15, 0.2);
            color: var(--accent-yellow);
            border: 1px solid rgba(241, 196, 15, 0.5);
        }

        .status-connected {
            background: rgba(46, 204, 113, 0.2);
            color: #8ef8bc;
            border: 1px solid rgba(46, 204, 113, 0.55);
        }

        .status-disconnected {
            background: rgba(231, 76, 60, 0.2);
            color: #ff9d93;
            border: 1px solid rgba(231, 76, 60, 0.55);
        }

        .loading {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(241, 196, 15, 0.4);
            border-top-color: var(--accent-yellow);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .instructions {
            border: 1px solid rgba(0, 229, 255, 0.26);
            background: rgba(0, 229, 255, 0.07);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 22px;
        }

        .instructions h3 {
            font: 700 16px/1.1 'Orbitron', monospace;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .instructions ol {
            list-style: none;
            display: grid;
            gap: 9px;
        }

        .instructions li {
            position: relative;
            padding-left: 34px;
            color: #d9e6f5;
            font-size: 18px;
        }

        .instructions li::before {
            content: counter(step);
            counter-increment: step;
            position: absolute;
            left: 0;
            top: 2px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(0, 229, 255, 0.18);
            border: 1px solid rgba(0, 229, 255, 0.6);
            color: var(--accent-cyan);
            font: 700 12px/22px 'Orbitron', monospace;
            text-align: center;
        }

        .instructions ol {
            counter-reset: step;
        }

        .qr-container {
            width: 236px;
            height: 236px;
            margin: 0 auto 18px;
            border-radius: 12px;
            background: #ffffff;
            border: 4px solid rgba(255, 255, 255, 0.95);
            display: grid;
            place-items: center;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }

        #qrcode {
            width: 200px;
            height: 200px;
            display: grid;
            place-items: center;
        }

        .url-display {
            border-radius: 10px;
            border: 1px solid rgba(0, 229, 255, 0.26);
            background: rgba(8, 16, 26, 0.9);
            color: var(--accent-cyan);
            font: 700 14px/1.4 'Orbitron', monospace;
            letter-spacing: 0.4px;
            padding: 12px;
            margin-bottom: 20px;
            word-break: break-all;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
            z-index: 5;
        }

        .btn {
            flex: 1;
            min-width: 160px;
            padding: 12px 18px;
            border-radius: 10px;
            text-decoration: none;
            text-align: center;
            text-transform: uppercase;
            font: 700 15px/1 'Orbitron', monospace;
            letter-spacing: 1px;
            border: 1px solid transparent;
            transition: transform 0.2s ease, filter 0.2s ease;
            cursor: pointer;
            position: relative;
            z-index: 6;
            pointer-events: auto;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .btn-primary {
            background: linear-gradient(180deg, #22dcff 0%, #00b8d2 100%);
            color: #042532;
        }

        .btn-secondary {
            background: #1a2333;
            color: #d4dfec;
            border-color: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 640px) {
            .start-container {
                padding: 18px;
            }

            .instructions li {
                font-size: 16px;
            }

            .qr-container {
                width: 210px;
                height: 210px;
            }

            #qrcode {
                width: 180px;
                height: 180px;
            }

            .btn {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="start-container">
        <h1 class="logo"><span class="logo-main">REMOTE</span><span class="logo-sub">CONTROLLER</span></h1>

        <div class="instructions">
            <h3>Hoe te verbinden</h3>
            <ol>
                <li>Scan de QR code met je telefoon</li>
                <li>Open de link in je browser</li>
                <li>Gebruik de joystick om te richten</li>
                <li>Druk op SHOOT om te schieten!</li>
            </ol>
        </div>

        <div class="qr-container">
            <div id="qrcode"></div>
        </div>

        <div class="url-display" id="controller-url">
            Laden...
        </div>

        <div class="connection-status status-waiting" id="connection-status">
            <span class="loading"></span>
            Wachten op spelers...
        </div>

        <div class="instructions" style="margin-top: 14px; margin-bottom: 20px;">
            <h3>Spelers</h3>
            <ol id="players-list">
                <li id="player-slot-1">Speler 1: niet verbonden</li>
                <li id="player-slot-2">Speler 2: niet verbonden</li>
            </ol>
        </div>

        <div class="buttons">
            <button id="start-game-btn" class="btn btn-primary" type="button">Start Game</button>
            <button class="btn btn-secondary" type="button" onclick="copyUrl()">Kopieer URL</button>
        </div>
    </div>

    <script>
        // Generate QR code with controller URL
        function generateQRCode() {
            const protocol = window.location.protocol;
            const host = window.location.host;
            const controllerUrl = `${protocol}//${host}/controller.html`;

            // Display URL
            document.getElementById('controller-url').textContent = controllerUrl;

            // Generate QR code using qrcode-generator
            try {
                const qr = qrcode(0, 'M');
                qr.addData(controllerUrl);
                qr.make();
                
                // Create canvas
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const size = 200;
                const moduleCount = qr.getModuleCount();
                const cellSize = size / moduleCount;
                
                canvas.width = size;
                canvas.height = size;
                
                // Draw QR code
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);
                ctx.fillStyle = '#000000';
                
                for (let row = 0; row < moduleCount; row++) {
                    for (let col = 0; col < moduleCount; col++) {
                        if (qr.isDark(row, col)) {
                            ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                        }
                    }
                }
                
                // Add canvas to page
                document.getElementById('qrcode').appendChild(canvas);
                console.log('QR code generated!');
            } catch (error) {
                console.error('Error generating QR code:', error);
                document.getElementById('qrcode').innerHTML = '<p style="color: red;">Fout bij genereren QR code</p>';
            }
        }

        // Copy URL to clipboard
        function copyUrl() {
            const url = document.getElementById('controller-url').textContent;
            navigator.clipboard.writeText(url).then(() => {
                alert('URL gekopieerd naar klembord!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = url;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('URL gekopieerd naar klembord!');
            });
        }

        // Check speler-verbindingen op startscherm
        function checkConnectionStatus() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}`;

            const ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                ws.send(JSON.stringify({
                    type: 'register',
                    role: 'start'
                }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    if (data.type === 'player_update') {
                        updatePlayerStatus(data.playerIds || [], data.maxPlayers || 2);
                    } else if (data.type === 'registered') {
                        updateStatus('waiting', 'Wachten op spelers...');
                    }
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            ws.onclose = () => {
                updateStatus('disconnected', 'Verbinding verbroken');
            };

            ws.onerror = () => {
                updateStatus('disconnected', 'Verbindingsfout');
            };
        }

        function updatePlayerStatus(playerIds, maxPlayers) {
            const connectedSet = new Set(playerIds);
            for (let i = 1; i <= maxPlayers; i++) {
                const slot = document.getElementById(`player-slot-${i}`);
                if (!slot) continue;
                slot.textContent = connectedSet.has(i)
                    ? `Speler ${i}: verbonden`
                    : `Speler ${i}: niet verbonden`;
            }

            if (playerIds.length === 0) {
                updateStatus('waiting', 'Wachten op spelers...');
            } else {
                updateStatus('connected', `${playerIds.length}/${maxPlayers} spelers verbonden`);
            }
        }

        function updateStatus(status, message) {
            const statusElement = document.getElementById('connection-status');
            statusElement.className = `connection-status status-${status}`;

            if (status === 'waiting') {
                statusElement.innerHTML = `<span class="loading"></span>${message}`;
            } else {
                statusElement.textContent = message;
            }
        }

        function startGame() {
            window.location.href = 'index.html';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            generateQRCode();
            checkConnectionStatus();

            const startBtn = document.getElementById('start-game-btn');
            if (startBtn) {
                startBtn.addEventListener('click', startGame);
            }
        });
    </script>
</body>
</html>

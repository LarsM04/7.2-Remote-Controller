<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Controller - Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
    <!-- Start Screen -->
    <div id="start-screen">
        <div id="start-content">
            <h1>REMOTE CONTROLLER</h1>
            <p>Scan de QR code met je telefoon om de controller te verbinden</p>
            
            <div id="qr-code"></div>
            
            <div id="controller-url">
                <span id="url-text"></span>
                <button id="copy-url-btn">Kopieer</button>
            </div>
            
            <div id="connection-info">
                <div id="connection-dot"></div>
                <span id="connection-text">Wachten op controller...</span>
            </div>
            
            <button id="start-game-btn" disabled>START GAME</button>
        </div>
    </div>
    
    <!-- Game Container -->
    <div id="game-container" style="display: none;">
        <!-- Background layer -->
        <div id="background"></div>
        
        <!-- Game area -->
        <div id="game-area">
            <!-- Crosshair -->
            <div id="crosshair">
                <div class="crosshair-line horizontal"></div>
                <div class="crosshair-line vertical"></div>
                <div class="crosshair-dot"></div>
            </div>
            
            <!-- Targets will be spawned here dynamically -->
            <div id="targets-container"></div>
            
            <!-- Shot effects -->
            <div id="shot-effects"></div>
        </div>
        
        <!-- UI Elements -->
        <div id="ui-overlay">
            <div id="score">Score: <span id="score-value">0</span></div>
            <div id="ammo">Ammo: <span id="ammo-value">∞</span></div>
            <div id="connection-status">Status: <span id="status-text">Verbonden</span></div>
        </div>
    </div>
    
    <script src="game.js"></script>
    <script src="start-screen.js"></script>
</body>
</html>

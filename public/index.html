<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Controller - Game</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Nieuw: extra UI-elementen voor wave systeem */
        #wave {
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
            border: 1px solid #00ff00;
        }

        #wave-value {
            color: #fff;
        }

        /* Nieuw: stijlvolle wave announcement in het midden */
        #wave-announcement {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 120;
            pointer-events: none;
            font-size: clamp(42px, 10vw, 100px);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.9), 0 0 35px rgba(0, 212, 255, 0.55);
            opacity: 0;
        }

        #wave-announcement.show {
            animation: wavePulse 2s ease-in-out forwards;
        }

        @keyframes wavePulse {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.82);
            }
            20% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            80% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.04);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.08);
            }
        }

        /* Nieuw: boodschap voor game over */
        #game-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 125;
            padding: 18px 30px;
            border: 2px solid #ff3333;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.78);
            color: #ff6666;
            font-size: clamp(24px, 4vw, 42px);
            font-weight: 800;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.8);
            display: none;
            pointer-events: none;
        }

        /* Nieuw: boss uiterlijk (2x normaal) */
        .target.boss {
            width: 120px;
            height: 120px;
            border-width: 4px;
            background: radial-gradient(circle at 30% 30%, #ffb347, #ff5f1f 60%, #8f1800);
            border-color: #ffcb80;
            box-shadow: 0 0 28px rgba(255, 120, 0, 0.75), inset 0 0 24px rgba(0, 0, 0, 0.35);
        }

        .target.boss::before {
            width: 72px;
            height: 72px;
            background: radial-gradient(circle at 30% 30%, #ffd191, #ff8f42);
        }

        .target.boss::after {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle at 30% 30%, #ffe7b8, #ffc27a);
        }

        /* Nieuw: zwevende healthbar boven de boss */
        .boss-health-wrap {
            position: absolute;
            width: 130px;
            height: 12px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #ffffff;
            border-radius: 8px;
            overflow: hidden;
            z-index: 95;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .boss-health-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #32cd32, #ffd700 60%, #ff3b30);
            transition: width 0.15s linear;
        }

        /* Nieuw: speciale feedback bij boss kill */
        #boss-defeat-flash {
            position: absolute;
            inset: 0;
            z-index: 115;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at center, rgba(255, 215, 0, 0.45), rgba(255, 110, 0, 0.2), transparent 70%);
        }

        /* --- ENEMY VISUALS: nieuw --- */
        #enemy-canvas {
            position: absolute;
            inset: 0;
            z-index: 92;
            pointer-events: none;
        }

        .target {
            opacity: 0;
        }
        /* --- ENEMY VISUALS: einde --- */

        #boss-defeat-flash.show {
            animation: bossFlash 0.7s ease-out forwards;
        }

        @keyframes bossFlash {
            0% { opacity: 0; }
            30% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Game Container -->
    <div id="game-container">
        <!-- Background layer -->
        <div id="background"></div>

        <!-- Game area -->
        <div id="game-area">
            <!-- Crosshairs -->
            <div id="crosshair" class="crosshair-player crosshair-player-1">
                <div class="crosshair-line horizontal"></div>
                <div class="crosshair-line vertical"></div>
                <div class="crosshair-dot"></div>
            </div>
            <div id="crosshair-2" class="crosshair-player crosshair-player-2">
                <div class="crosshair-line horizontal"></div>
                <div class="crosshair-line vertical"></div>
                <div class="crosshair-dot"></div>
            </div>

            <!-- Targets will be spawned here dynamically -->
            <div id="targets-container"></div>
            <!-- --- ENEMY VISUALS: nieuw --- -->
            <canvas id="enemy-canvas"></canvas>
            <!-- --- ENEMY VISUALS: einde --- -->

            <!-- Shot effects -->
            <div id="shot-effects"></div>

            <!-- Nieuw: wave aankondiging -->
            <div id="wave-announcement"></div>

            <!-- Nieuw: game over melding -->
            <div id="game-message"></div>

            <!-- Nieuw: speciale boss feedback laag -->
            <div id="boss-defeat-flash"></div>
        </div>

        <!-- UI Elements -->
        <div id="ui-overlay">
            <div id="player-1-hud" class="player-hud player-hud-left">
                <span class="player-hud-title">Speler 1</span>
                <div class="hud-item"><span class="hud-label">AMMO</span><span id="ammo-value-p1" class="hud-value ammo-value">0</span></div>
                <div class="hud-item"><span class="hud-label">ACC</span><span id="accuracy-value-p1" class="hud-value">0%</span></div>
            </div>
            <div class="hud-center-group">
                <div id="score" class="hud-item"><span class="hud-label">SCORE</span><span id="score-value" class="hud-value score-value">0</span></div>
                <div id="wave" class="hud-item"><span class="hud-label">WAVE</span><span id="wave-value" class="hud-value wave-value">1</span></div>
                <div id="connection-status" class="status-pill"><span id="status-text">Controller verbonden</span></div>
            </div>
            <div id="player-2-hud" class="player-hud player-hud-right">
                <span class="player-hud-title">Speler 2</span>
                <div class="hud-item"><span class="hud-label">AMMO</span><span id="ammo-value-p2" class="hud-value ammo-value">0</span></div>
                <div class="hud-item"><span class="hud-label">ACC</span><span id="accuracy-value-p2" class="hud-value">0%</span></div>
            </div>
            <a href="start.html" id="back-to-start" class="back-btn">← Terug</a>
        </div>

        <div id="wave-stats-overlay" class="wave-stats-overlay hidden">
            <div class="wave-stats-card">
                <h2 id="wave-stats-title">Wave 1 voltooid</h2>
                <div class="wave-stats-grid">
                    <div class="wave-stats-col">
                        <h3>Speler 1</h3>
                        <p id="wave-p1-shots">Schoten: 0</p>
                        <p id="wave-p1-hits">Hits: 0</p>
                        <p id="wave-p1-accuracy">Accuracy: 0%</p>
                        <p id="wave-p1-ammo-used">Ammo gebruikt: 0</p>
                    </div>
                    <div class="wave-stats-col">
                        <h3>Speler 2</h3>
                        <p id="wave-p2-shots">Schoten: 0</p>
                        <p id="wave-p2-hits">Hits: 0</p>
                        <p id="wave-p2-accuracy">Accuracy: 0%</p>
                        <p id="wave-p2-ammo-used">Ammo gebruikt: 0</p>
                    </div>
                </div>
                <p id="wave-team-accuracy" class="wave-team-accuracy">Team accuracy: 0%</p>
            </div>
        </div>
    </div>

    <script>
        // Nieuw: volledige game-logica inclusief wave systeem, boss waves en ammo per wave
        class Game {
            constructor() {
                this.crosshairs = {
                    1: {
                        element: document.getElementById('crosshair'),
                        x: window.innerWidth / 2,
                        y: window.innerHeight / 2
                    },
                    2: {
                        element: document.getElementById('crosshair-2'),
                        x: window.innerWidth / 2,
                        y: window.innerHeight / 2
                    }
                };
                this.activePlayers = new Set([1]);
                this.gameArea = document.getElementById('game-area');
                this.targetsContainer = document.getElementById('targets-container');
                this.shotEffects = document.getElementById('shot-effects');

                // --- ENEMY VISUALS: nieuw ---
                this.enemyCanvas = document.getElementById('enemy-canvas');
                this.enemyCtx = this.enemyCanvas.getContext('2d');
                this.deathEffects = [];
                this.enemyEmojiMap = ['👾', '🛸', '☄️', '🤖'];
                // --- ENEMY VISUALS: einde ---

                this.scoreValue = document.getElementById('score-value');
                this.ammoValueP1 = document.getElementById('ammo-value-p1');
                this.ammoValueP2 = document.getElementById('ammo-value-p2');
                this.accuracyValueP1 = document.getElementById('accuracy-value-p1');
                this.accuracyValueP2 = document.getElementById('accuracy-value-p2');
                this.waveValue = document.getElementById('wave-value');
                this.statusText = document.getElementById('status-text');

                this.waveAnnouncement = document.getElementById('wave-announcement');
                this.gameMessage = document.getElementById('game-message');
                this.bossDefeatFlash = document.getElementById('boss-defeat-flash');

                this.waveStatsOverlay = document.getElementById('wave-stats-overlay');
                this.waveStatsTitle = document.getElementById('wave-stats-title');
                this.waveP1Shots = document.getElementById('wave-p1-shots');
                this.waveP1Hits = document.getElementById('wave-p1-hits');
                this.waveP1Accuracy = document.getElementById('wave-p1-accuracy');
                this.waveP1AmmoUsed = document.getElementById('wave-p1-ammo-used');
                this.waveP2Shots = document.getElementById('wave-p2-shots');
                this.waveP2Hits = document.getElementById('wave-p2-hits');
                this.waveP2Accuracy = document.getElementById('wave-p2-accuracy');
                this.waveP2AmmoUsed = document.getElementById('wave-p2-ammo-used');
                this.waveTeamAccuracy = document.getElementById('wave-team-accuracy');

                this.score = 0;
                this.wave = 1;
                this.playerAmmo = { 1: 0, 2: 0 };
                this.currentWaveStats = this.createEmptyWaveStats();

                this.targets = [];
                this.gameOver = false;
                this.waveTransition = false;

                this.shootCooldown = false;
                this.ws = null;

                this.lastFrameTime = performance.now();
                this.gameLoopHandle = null;

                this.init();
            }

            init() {
                this.setupEventListeners();
                this.connectWebSocket();
                this.updateConnectedPlayers([1]);
                this.updateCrosshairPosition(1);
                this.updateCrosshairPosition(2);

                // --- ENEMY VISUALS: nieuw ---
                this.resizeEnemyCanvas();
                // --- ENEMY VISUALS: einde ---

                // Nieuw: start de eerste wave
                this.startWave(this.wave);

                // Nieuw: continue loop voor target movement en boss healthbar follow
                this.startGameLoop();
            }

            setupEventListeners() {
                this.gameArea.addEventListener('mousemove', (e) => {
                    this.setCrosshairPosition(1, e.clientX, e.clientY);
                });

                this.gameArea.addEventListener('click', (e) => {
                    this.shoot(1, e.clientX, e.clientY);
                });

                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        const playerOne = this.crosshairs[1];
                        this.shoot(1, playerOne.x, playerOne.y);
                    }
                });

                window.addEventListener('resize', () => {
                    Object.keys(this.crosshairs).forEach((playerIdKey) => {
                        const playerId = Number(playerIdKey);
                        const state = this.crosshairs[playerId];
                        this.setCrosshairPosition(
                            playerId,
                            Math.min(state.x, window.innerWidth),
                            Math.min(state.y, window.innerHeight)
                        );
                    });

                    // --- ENEMY VISUALS: nieuw ---
                    this.resizeEnemyCanvas();
                    // --- ENEMY VISUALS: einde ---
                });
            }

            connectWebSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}`;

                this.ws = new WebSocket(wsUrl);

                this.ws.onopen = () => {
                    this.updateConnectionStatus('Verbonden met server');
                    this.ws.send(JSON.stringify({ type: 'register', role: 'game' }));
                };

                this.ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);

                        switch (data.type) {
                            case 'registered':
                                this.updateConnectionStatus('Wachten op spelers...');
                                break;
                            case 'controller_connected':
                                this.updateConnectionStatus('Speler verbonden');
                                break;
                            case 'controller_disconnected':
                                this.updateConnectionStatus('Speler verbroken');
                                break;
                            case 'player_update':
                                this.updateConnectedPlayers(data.playerIds || []);
                                break;
                            case 'move': {
                                const playerId = data.playerId || 1;
                                if (data.x !== undefined && data.y !== undefined) {
                                    this.setCrosshairFromAbsolute(playerId, data.x, data.y);
                                } else {
                                    this.updateCrosshairFromController(playerId, data.deltaX || 0, data.deltaY || 0);
                                }
                                break;
                            }
                            // Nieuw: expliciete ondersteuning voor { type: "aim", x, y }
                            case 'aim': {
                                const playerId = data.playerId || 1;
                                if (data.x !== undefined && data.y !== undefined) {
                                    this.setCrosshairFromAbsolute(playerId, data.x, data.y);
                                }
                                break;
                            }
                            case 'shoot':
                                this.shootFromController(data.playerId || 1);
                                break;
                            case 'status':
                                this.updateConnectionStatus(data.message);
                                break;
                        }
                    } catch (e) {
                        console.error('Error parsing message:', e);
                    }
                };

                this.ws.onclose = () => {
                    this.updateConnectionStatus('Verbinding verbroken');
                    setTimeout(() => this.connectWebSocket(), 3000);
                };

                this.ws.onerror = () => {
                    this.updateConnectionStatus('Verbindingsfout');
                };
            }

            // Nieuw: wave start, ammo refill en wave text animatie
            startWave(waveNumber) {
                this.waveTransition = true;
                this.clearTargets();
                this.hideWaveStatsOverlay();

                this.wave = waveNumber;
                this.waveValue.textContent = this.wave;

                const ammoPerPlayer = 10 + this.wave * 2;
                this.playerAmmo[1] = ammoPerPlayer;
                this.playerAmmo[2] = ammoPerPlayer;
                this.currentWaveStats = this.createEmptyWaveStats();
                this.updateAmmoUI();
                this.updateAccuracyHUD();

                this.showWaveAnnouncement(`Wave ${this.wave}`);

                setTimeout(() => {
                    this.spawnWaveTargets();
                    this.waveTransition = false;
                }, 2000);
            }

            // Nieuw: progressieregels voor targets per wave en snelheid
            spawnWaveTargets() {
                if (this.wave % 5 === 0) {
                    this.spawnBossTarget();
                    return;
                }

                let targetCount;
                if (this.wave === 1) {
                    targetCount = 4;
                } else if (this.wave === 2) {
                    targetCount = 6;
                } else {
                    targetCount = 6 + ((this.wave - 2) * 2);
                }

                const speedMultiplier = Math.pow(1.1, this.wave - 1);

                for (let i = 0; i < targetCount; i++) {
                    this.spawnNormalTarget(speedMultiplier);
                }
            }

            spawnNormalTarget(speedMultiplier) {
                const target = document.createElement('div');
                target.className = 'target';

                const size = 60;
                const padding = 80;
                const x = padding + Math.random() * (window.innerWidth - padding * 2 - size);
                const y = padding + Math.random() * (window.innerHeight - padding * 2 - size);

                target.style.left = `${x}px`;
                target.style.top = `${y}px`;

                this.targetsContainer.appendChild(target);

                // Nieuw: bewegende targets zodat hogere waves duidelijk sneller aanvoelen
                const baseSpeed = 45;
                const angle = Math.random() * Math.PI * 2;
                const velocity = baseSpeed * speedMultiplier;

                const targetObj = {
                    type: 'normal',
                    element: target,
                    x,
                    y,
                    size,
                    // --- ENEMY VISUALS: nieuw ---
                    wave: this.wave,
                    radius: size / 2,
                    lastHitTime: 0,
                    hitFlashUntil: 0,
                    isDead: false,
                    // --- ENEMY VISUALS: einde ---
                    vx: Math.cos(angle) * velocity,
                    vy: Math.sin(angle) * velocity
                };

                this.targets.push(targetObj);
            }

            // Nieuw: boss wave target met 5 hp en healthbar
            spawnBossTarget() {
                const target = document.createElement('div');
                target.className = 'target boss';

                const size = 120;
                const x = (window.innerWidth / 2) - (size / 2);
                const y = Math.max(120, window.innerHeight * 0.2);

                target.style.left = `${x}px`;
                target.style.top = `${y}px`;

                this.targetsContainer.appendChild(target);

                const healthWrap = document.createElement('div');
                healthWrap.className = 'boss-health-wrap';
                const healthFill = document.createElement('div');
                healthFill.className = 'boss-health-fill';
                healthWrap.appendChild(healthFill);
                this.gameArea.appendChild(healthWrap);

                const baseSpeed = 120 * Math.pow(1.1, this.wave - 1);

                const boss = {
                    type: 'boss',
                    element: target,
                    healthWrap,
                    healthFill,
                    hp: 5,
                    maxHp: 5,
                    x,
                    y,
                    size,
                    // --- ENEMY VISUALS: nieuw ---
                    wave: this.wave,
                    radius: size / 2,
                    isBoss: true,
                    angle: 0,
                    lastHitTime: 0,
                    hitFlashUntil: 0,
                    isDead: false,
                    // --- ENEMY VISUALS: einde ---
                    vx: baseSpeed,
                    vy: 0
                };

                this.targets.push(boss);
                this.updateBossHealthBar(boss);
                this.updateBossHealthBarPosition(boss);
            }

            showWaveAnnouncement(text) {
                this.waveAnnouncement.textContent = text;
                this.waveAnnouncement.classList.remove('show');
                // force reflow voor herstart animatie
                void this.waveAnnouncement.offsetWidth;
                this.waveAnnouncement.classList.add('show');
            }

            shoot(playerId, x, y) {
                if (this.gameOver || this.waveTransition || this.shootCooldown) return;
                if (!this.playerAmmo[playerId] || this.playerAmmo[playerId] <= 0) return;

                this.shootCooldown = true;
                setTimeout(() => {
                    this.shootCooldown = false;
                }, 80);

                this.playerAmmo[playerId] -= 1;
                this.currentWaveStats[playerId].shots += 1;
                this.currentWaveStats[playerId].ammoUsed += 1;
                this.updateAmmoUI();

                this.createShotEffect(x, y);

                const hitTarget = this.checkTargetHit(x, y);
                if (hitTarget) {
                    this.hitTarget(playerId, hitTarget);
                }

                this.updateAccuracyHUD();
                this.playShootSound();

                const noAmmoLeft = [1, 2].every((id) => {
                    const active = this.activePlayers.has(id) || id === 1;
                    return !active || this.playerAmmo[id] <= 0;
                });

                if (noAmmoLeft && this.targets.length > 0) {
                    this.triggerGameOver('Game Over - geen ammo meer');
                }
            }

            checkTargetHit(x, y) {
                // Boss prioriteit bij overlap zodat center hits betrouwbaar voelen
                const sorted = [...this.targets].sort((a, b) => (b.type === 'boss') - (a.type === 'boss'));

                for (const target of sorted) {
                    const centerX = target.x + target.size / 2;
                    const centerY = target.y + target.size / 2;
                    const radius = target.size / 2;

                    const distance = Math.hypot(x - centerX, y - centerY);
                    if (distance <= radius) {
                        return target;
                    }
                }

                return null;
            }

            // Nieuw: aparte hit-afhandeling voor normale target en boss hp
            hitTarget(playerId, target) {
                const now = performance.now();
                this.currentWaveStats[playerId].hits += 1;
                this.updateAccuracyHUD();

                if (target.type === 'boss') {
                    target.hp -= 1;
                    this.updateBossHealthBar(target);

                    target.element.classList.add('hit');
                    setTimeout(() => target.element.classList.remove('hit'), 120);

                    if (target.hp <= 0) {
                        this.score += 500;
                        this.scoreValue.textContent = this.score;

                        target.isDead = true;
                        this.spawnDeathEffect(target);

                        this.triggerBossDefeatFeedback();
                        this.removeTarget(target);
                        this.checkWaveClear();
                    } else {
                        target.lastHitTime = now;
                        target.hitFlashUntil = now + 100;
                    }
                    return;
                }

                target.element.classList.add('hit');
                this.score += 10;
                this.scoreValue.textContent = this.score;

                target.lastHitTime = now;
                target.hitFlashUntil = now + 100;
                setTimeout(() => {
                    target.isDead = true;
                    this.spawnDeathEffect(target);
                    this.removeTarget(target);
                    this.checkWaveClear();
                }, 220);
            }

            removeTarget(target) {
                if (target.healthWrap) {
                    target.healthWrap.remove();
                }
                target.element.remove();

                const index = this.targets.indexOf(target);
                if (index > -1) {
                    this.targets.splice(index, 1);
                }
            }

            // Nieuw: wave is klaar als alle targets van die wave weg zijn
            checkWaveClear() {
                if (this.gameOver || this.waveTransition) return;
                if (this.targets.length !== 0) return;

                this.waveTransition = true;
                this.showWaveStatsOverlay(this.wave);
                setTimeout(() => {
                    this.startWave(this.wave + 1);
                }, 2600);
            }

            startGameLoop() {
                const loop = (time) => {
                    const deltaTime = Math.min(0.05, (time - this.lastFrameTime) / 1000);
                    this.lastFrameTime = time;

                    this.updateTargets(deltaTime);
                    // --- ENEMY VISUALS: nieuw ---
                    this.renderEnemyVisuals(time);
                    // --- ENEMY VISUALS: einde ---
                    this.gameLoopHandle = requestAnimationFrame(loop);
                };

                this.gameLoopHandle = requestAnimationFrame(loop);
            }

            // Nieuw: realtime beweging targets + boss heen-en-weer
            updateTargets(deltaTime) {
                for (const target of this.targets) {
                    target.x += target.vx * deltaTime;
                    target.y += target.vy * deltaTime;

                    const minX = 0;
                    const maxX = window.innerWidth - target.size;
                    const minY = 70;
                    const maxY = window.innerHeight - target.size;

                    if (target.type === 'boss') {
                        // Boss beweegt alleen horizontaal heen en weer
                        if (target.x <= minX || target.x >= maxX) {
                            target.vx *= -1;
                            target.x = Math.max(minX, Math.min(target.x, maxX));
                        }
                    } else {
                        // Normale targets stuiteren in beide assen
                        if (target.x <= minX || target.x >= maxX) {
                            target.vx *= -1;
                            target.x = Math.max(minX, Math.min(target.x, maxX));
                        }
                        if (target.y <= minY || target.y >= maxY) {
                            target.vy *= -1;
                            target.y = Math.max(minY, Math.min(target.y, maxY));
                        }
                    }

                    target.element.style.left = `${target.x}px`;
                    target.element.style.top = `${target.y}px`;

                    if (target.type === 'boss') {
                        this.updateBossHealthBarPosition(target);
                    }
                }
            }

            updateBossHealthBar(target) {
                const hpPercentage = Math.max(0, (target.hp / target.maxHp) * 100);
                target.healthFill.style.width = `${hpPercentage}%`;
            }

            // --- ENEMY VISUALS: nieuw ---
            resizeEnemyCanvas() {
                this.enemyCanvas.width = window.innerWidth;
                this.enemyCanvas.height = window.innerHeight;
            }

            getEmojiForWave(wave) {
                const index = ((wave - 1) % 4 + 4) % 4;
                return this.enemyEmojiMap[index];
            }

            spawnDeathEffect(target) {
                const centerX = target.x + target.size / 2;
                const centerY = target.y + target.size / 2;
                const startTime = performance.now();
                const stars = [];

                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI * 2 * i) / 6;
                    const speed = 20 + Math.random() * 30;
                    stars.push({ angle, speed });
                }

                this.deathEffects.push({ centerX, centerY, startTime, duration: 400, stars });
            }

            renderEnemyVisuals(time) {
                const ctx = this.enemyCtx;
                ctx.clearRect(0, 0, this.enemyCanvas.width, this.enemyCanvas.height);

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                for (const target of this.targets) {
                    if (target.isDead) {
                        continue;
                    }

                    const centerX = target.x + target.size / 2;
                    const centerY = target.y + target.size / 2;
                    const radius = target.radius || target.size / 2;
                    const flashActive = target.hitFlashUntil && time <= target.hitFlashUntil;

                    if (target.type === 'boss') {
                        target.angle = (target.angle || 0) + 0.01;
                        this.drawBossUfo(ctx, centerX, centerY, radius, target.angle, flashActive);
                    } else {
                        const emoji = this.getEmojiForWave(target.wave || this.wave);
                        ctx.save();
                        ctx.font = `${radius * 2}px serif`;
                        if (flashActive) {
                            ctx.shadowColor = 'rgba(255,255,255,0.95)';
                            ctx.shadowBlur = 14;
                        }
                        ctx.fillText(emoji, centerX, centerY);
                        if (flashActive) {
                            ctx.fillStyle = 'rgba(255,255,255,0.25)';
                            ctx.beginPath();
                            ctx.arc(centerX, centerY, radius * 0.9, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    }
                }

                this.renderDeathEffects(ctx, time);
            }

            drawBossUfo(ctx, x, y, radius, angle, flashActive) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);

                const glow = ctx.createRadialGradient(0, -radius * 0.45, radius * 0.1, 0, -radius * 0.45, radius * 1.25);
                glow.addColorStop(0, 'rgba(68,204,255,0.3)');
                glow.addColorStop(1, 'rgba(68,204,255,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(0, -radius * 0.45, radius * 1.25, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#888';
                ctx.beginPath();
                ctx.ellipse(0, 0, radius, radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(68,204,255,0.8)';
                ctx.beginPath();
                ctx.arc(0, -radius * 0.2, radius * 0.6, Math.PI, 0, false);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#ffd84a';
                for (let i = 0; i < 3; i++) {
                    const offset = (i - 1) * radius * 0.45;
                    ctx.beginPath();
                    ctx.arc(offset, 0, radius * 0.12, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (flashActive) {
                    ctx.fillStyle = 'rgba(255,255,255,0.35)';
                    ctx.beginPath();
                    ctx.arc(0, 0, radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            renderDeathEffects(ctx, time) {
                this.deathEffects = this.deathEffects.filter((effect) => {
                    const elapsed = time - effect.startTime;
                    if (elapsed > effect.duration) {
                        return false;
                    }

                    const progress = elapsed / effect.duration;
                    const distance = 8 + progress * 34;

                    ctx.save();
                    ctx.globalAlpha = 1 - progress;
                    ctx.font = `${14 + progress * 6}px serif`;
                    for (const star of effect.stars) {
                        const sx = effect.centerX + Math.cos(star.angle) * distance * (star.speed / 40);
                        const sy = effect.centerY + Math.sin(star.angle) * distance * (star.speed / 40);
                        ctx.fillText('✨', sx, sy);
                    }
                    ctx.restore();

                    return true;
                });
            }
            // --- ENEMY VISUALS: einde ---

            updateBossHealthBarPosition(target) {
                const barX = target.x + (target.size / 2);
                const barY = target.y - 14;
                target.healthWrap.style.left = `${barX}px`;
                target.healthWrap.style.top = `${barY}px`;
            }

            triggerBossDefeatFeedback() {
                this.showWaveAnnouncement('BOSS VERSLAGEN +500');
                this.bossDefeatFlash.classList.remove('show');
                void this.bossDefeatFlash.offsetWidth;
                this.bossDefeatFlash.classList.add('show');
            }

            triggerGameOver(message) {
                this.gameOver = true;
                this.gameMessage.textContent = message;
                this.gameMessage.style.display = 'block';
            }

            clearTargets() {
                this.targets.forEach((target) => {
                    if (target.healthWrap) {
                        target.healthWrap.remove();
                    }
                    target.element.remove();
                });
                this.targets = [];
            }

            createShotEffect(x, y) {
                const effect = document.createElement('div');
                effect.className = 'shot-effect';
                effect.style.left = `${x - 10}px`;
                effect.style.top = `${y - 10}px`;
                this.shotEffects.appendChild(effect);

                setTimeout(() => {
                    effect.remove();
                }, 300);
            }

            updateAmmoUI() {
                this.ammoValueP1.textContent = this.playerAmmo[1];
                this.ammoValueP2.textContent = this.playerAmmo[2];
            }

            calculateAccuracy(playerId) {
                const stats = this.currentWaveStats[playerId];
                if (!stats || stats.shots === 0) return 0;
                return Math.round((stats.hits / stats.shots) * 100);
            }

            updateAccuracyHUD() {
                this.accuracyValueP1.textContent = `${this.calculateAccuracy(1)}%`;
                this.accuracyValueP2.textContent = `${this.calculateAccuracy(2)}%`;
            }

            createEmptyWaveStats() {
                return {
                    1: { shots: 0, hits: 0, ammoUsed: 0 },
                    2: { shots: 0, hits: 0, ammoUsed: 0 }
                };
            }

            showWaveStatsOverlay(waveNumber) {
                const p1 = this.currentWaveStats[1];
                const p2 = this.currentWaveStats[2];

                this.waveStatsTitle.textContent = `Wave ${waveNumber} voltooid`;
                this.waveP1Shots.textContent = `Schoten: ${p1.shots}`;
                this.waveP1Hits.textContent = `Hits: ${p1.hits}`;
                this.waveP1Accuracy.textContent = `Accuracy: ${this.calculateAccuracy(1)}%`;
                this.waveP1AmmoUsed.textContent = `Ammo gebruikt: ${p1.ammoUsed}`;

                this.waveP2Shots.textContent = `Schoten: ${p2.shots}`;
                this.waveP2Hits.textContent = `Hits: ${p2.hits}`;
                this.waveP2Accuracy.textContent = `Accuracy: ${this.calculateAccuracy(2)}%`;
                this.waveP2AmmoUsed.textContent = `Ammo gebruikt: ${p2.ammoUsed}`;

                const teamShots = p1.shots + p2.shots;
                const teamHits = p1.hits + p2.hits;
                const teamAccuracy = teamShots > 0 ? Math.round((teamHits / teamShots) * 100) : 0;
                this.waveTeamAccuracy.textContent = `Team accuracy: ${teamAccuracy}%`;

                this.waveStatsOverlay.classList.remove('hidden');
            }

            hideWaveStatsOverlay() {
                this.waveStatsOverlay.classList.add('hidden');
            }

            updateCrosshairPosition(playerId) {
                const state = this.crosshairs[playerId];
                if (!state) return;

                state.element.style.left = `${state.x}px`;
                state.element.style.top = `${state.y}px`;
            }

            setCrosshairPosition(playerId, x, y) {
                const state = this.crosshairs[playerId];
                if (!state) return;

                state.x = x;
                state.y = y;
                this.updateCrosshairPosition(playerId);
            }

            updateCrosshairFromController(playerId, deltaX, deltaY) {
                const state = this.crosshairs[playerId];
                if (!state) return;

                const padding = 20;
                const nextX = state.x + deltaX;
                const nextY = state.y + deltaY;
                state.x = Math.max(padding, Math.min(nextX, window.innerWidth - padding));
                state.y = Math.max(padding, Math.min(nextY, window.innerHeight - padding));

                this.updateCrosshairPosition(playerId);
            }

            setCrosshairFromAbsolute(playerId, x, y) {
                const state = this.crosshairs[playerId];
                if (!state) return;

                const padding = 20;
                state.x = padding + x * (window.innerWidth - padding * 2);
                state.y = padding + y * (window.innerHeight - padding * 2);
                this.updateCrosshairPosition(playerId);
            }

            updateConnectedPlayers(playerIds) {
                this.activePlayers = new Set(playerIds.length ? playerIds : [1]);
                [1, 2].forEach((playerId) => {
                    const state = this.crosshairs[playerId];
                    if (!state) return;
                    const visible = this.activePlayers.has(playerId) || playerId === 1;
                    state.element.style.display = visible ? 'block' : 'none';
                });

                const playerTwoHud = document.getElementById('player-2-hud');
                if (playerTwoHud) {
                    playerTwoHud.style.opacity = this.activePlayers.has(2) ? '1' : '0.45';
                }

                const amount = playerIds.length;
                if (amount === 0) {
                    this.updateConnectionStatus('Wachten op spelers...');
                } else if (amount === 1) {
                    this.updateConnectionStatus('1 speler verbonden');
                } else {
                    this.updateConnectionStatus('2 spelers verbonden');
                }
            }

            shootFromController(playerId) {
                const state = this.crosshairs[playerId];
                if (!state) return;
                this.shoot(playerId, state.x, state.y);
            }

            playShootSound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);

                    oscillator.frequency.value = 800;
                    oscillator.type = 'square';

                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                } catch (e) {
                    // Audio fallback bewust stil
                }
            }

            updateConnectionStatus(status) {
                this.statusText.textContent = status;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.game = new Game();
        });
    </script>
</body>
</html>
